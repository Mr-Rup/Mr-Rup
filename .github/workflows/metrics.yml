name: Generate GitHub Stats

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Stats Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Mr-Rup
          template: classic
          base: header, activity, community, repositories
          base_indepth: yes
          config_timezone: Asia/Kolkata
          config_display: large
          config_output: svg
          filename: github-metrics.svg
          committer_branch: stats
          committer_message: "chore: update github-metrics.svg [skip ci]"

      - name: Generate Languages Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Mr-Rup
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_sections: most-used
          plugin_languages_threshold: 2%
          config_display: large
          config_output: svg
          filename: github-languages.svg
          committer_branch: stats
          committer_message: "chore: update github-languages.svg [skip ci]"

      - name: Generate Habits Card
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: Mr-Rup
          template: classic
          base: ""
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_days: 30
          plugin_habits_from: 200
          config_display: large
          config_output: svg
          filename: github-habits.svg
          committer_branch: stats
          committer_message: "chore: update github-habits.svg [skip ci]"
